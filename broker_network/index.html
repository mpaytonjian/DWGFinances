<title>DWG Broker Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f6f7f9;
    --surface:#ffffff;
    --surface-2:#eef1f4;
    --line:#dde2e8;
    --line-soft:#eaeef2;
    --ink:#14181d;
    --ink-2:#3d4650;
    --muted:#69747f;
    --accent:#FF671C;
    --accent-ink:#ffffff;
    --accent-wash:rgba(255,103,28,.09);
    --accent-line:rgba(255,103,28,.42);
    --tag-slb:#4a5560;
    --tag-oh:#7a6a46;
    --tag-az:#4f6b57;
    --focus:#1f6feb;
    --logo-invert:1;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --bar-h:0px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0f1216;
      --surface:#171b21;
      --surface-2:#1e242b;
      --line:#2b323b;
      --line-soft:#232a32;
      --ink:#e6e9ed;
      --ink-2:#c2c9d1;
      --muted:#8b96a4;
      --accent:#FF671C;
      --accent-ink:#160b04;
      --accent-wash:rgba(255,103,28,.14);
      --accent-line:rgba(255,103,28,.5);
      --tag-slb:#5d6873;
      --tag-oh:#8a7750;
      --tag-az:#5c7a64;
      --focus:#58a6ff;
      --logo-invert:0;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0f1216;
    --surface:#171b21;
    --surface-2:#1e242b;
    --line:#2b323b;
    --line-soft:#232a32;
    --ink:#e6e9ed;
    --ink-2:#c2c9d1;
    --muted:#8b96a4;
    --accent:#FF671C;
    --accent-ink:#160b04;
    --accent-wash:rgba(255,103,28,.14);
    --accent-line:rgba(255,103,28,.5);
    --tag-slb:#5d6873;
    --tag-oh:#8a7750;
    --tag-az:#5c7a64;
    --focus:#58a6ff;
    --logo-invert:0;
  }

  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:76px;
  }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  button{ font-family:inherit; }

  /* ---------- command bar ---------- */
  .bar{
    position:sticky; top:0; z-index:50;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:10px clamp(12px,2.2vw,22px);
    display:flex; flex-direction:column; gap:9px;
  }
  .bar-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:11px; flex:none; }
  .brand img{ height:22px; width:auto; display:block; filter:invert(var(--logo-invert)); }
  .brand .rule{ width:1px; height:18px; background:var(--line); }
  .brand .nm{
    font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
    white-space:nowrap;
  }
  .bar-spacer{ flex:1 1 60px; }

  .search{ position:relative; flex:1 1 300px; min-width:200px; }
  .search svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--muted); pointer-events:none;
  }
  .search input{
    width:100%; padding:8px 58px 8px 31px;
    background:var(--ground); color:var(--ink);
    border:1px solid var(--line); border-radius:6px;
    font-family:inherit; font-size:14px;
  }
  .search input::placeholder{ color:var(--muted); }
  .search input:focus{ outline:none; border-color:var(--accent-line); background:var(--surface); }
  .search kbd{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    font-family:var(--mono); font-size:10.5px; color:var(--muted);
    border:1px solid var(--line); border-radius:4px; padding:1px 5px; background:var(--surface);
  }
  .search input:not(:placeholder-shown) ~ kbd{ display:none; }

  select.sel, button.btn{
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:6px;
    font-family:inherit; font-size:13px; padding:7px 10px; cursor:pointer;
  }
  select.sel{ max-width:210px; }
  button.btn:hover, select.sel:hover{ border-color:var(--muted); }
  button.btn[aria-pressed="true"]{ background:var(--accent-wash); border-color:var(--accent-line); color:var(--ink); }

  .segs{ display:flex; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex:none; }
  .segs button{
    background:var(--surface); color:var(--muted); border:none; border-right:1px solid var(--line);
    font-family:inherit; font-size:12.5px; font-weight:500; padding:7px 12px; cursor:pointer; white-space:nowrap;
  }
  .segs button:last-child{ border-right:none; }
  .segs button:hover{ color:var(--ink); background:var(--surface-2); }
  .segs button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); font-weight:600; }

  .scope{
    display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;
    font-size:12.5px; color:var(--muted);
  }
  .scope .fig{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .scope .clear{
    background:none; border:none; color:var(--accent); font-family:inherit; font-size:12.5px;
    padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:2px;
  }

  /* ---------- panels (ask / add / preview) ---------- */
  .panel{
    border:1px solid var(--line); border-radius:8px; background:var(--surface);
    margin:10px clamp(12px,2.2vw,22px) 0; padding:12px 13px;
  }
  .panel h2{
    margin:0 0 3px; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  }
  .panel .hint{ font-size:12.5px; color:var(--muted); margin:0 0 9px; }
  .panel-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .panel-row input{
    flex:1 1 220px; min-width:0;
    background:var(--ground); color:var(--ink); border:1px solid var(--line); border-radius:6px;
    font-family:inherit; font-size:13.5px; padding:8px 10px;
  }
  .panel-row input:focus{ outline:none; border-color:var(--accent-line); }
  .grid-form{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grid-form input, .grid-form select{
    background:var(--ground); color:var(--ink); border:1px solid var(--line); border-radius:6px;
    font-family:inherit; font-size:13px; padding:8px 10px; min-width:0;
  }
  .answer{
    margin-top:10px; padding:11px 12px; border-radius:6px;
    background:var(--ground); border:1px solid var(--line-soft);
    font-size:13.5px; line-height:1.55; white-space:pre-wrap;
  }
  .answer.err{ color:#c25a4a; }
  .note{ font-size:12px; color:var(--muted); margin-top:8px; }
  .note.err{ color:#c25a4a; }
  textarea#previewText{
    width:100%; height:170px; resize:vertical; margin-top:8px;
    background:var(--ground); color:var(--ink-2);
    border:1px solid var(--line-soft); border-radius:6px; padding:10px 11px;
    font-family:var(--mono); font-size:12px; line-height:1.55;
  }
  textarea#previewText:focus{ outline:none; border-color:var(--accent-line); }

  button.go{
    background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent);
    border-radius:6px; font-family:inherit; font-size:13px; font-weight:600;
    padding:8px 16px; cursor:pointer; white-space:nowrap;
  }
  button.go:hover{ filter:brightness(1.06); }
  button.go:disabled{ opacity:.45; cursor:default; filter:none; }

  /* ---------- table ---------- */
  .sheet{ margin:10px clamp(12px,2.2vw,22px) 0; }
  .tablewrap{
    border:1px solid var(--line); border-radius:8px; background:var(--surface); overflow:clip;
  }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    position:sticky; top:var(--bar-h); z-index:20;
    background:var(--surface-2);
    border-bottom:1px solid var(--line);
    font-size:10.5px; font-weight:600; letter-spacing:.085em; text-transform:uppercase; color:var(--muted);
    text-align:left; padding:0; white-space:nowrap;
  }
  thead th button{
    width:100%; display:flex; align-items:center; gap:5px;
    background:none; border:none; color:inherit; font:inherit; letter-spacing:inherit; text-transform:inherit;
    padding:9px 10px; cursor:pointer; text-align:left;
  }
  thead th button:hover{ color:var(--ink); }
  thead th .arrow{ opacity:0; font-size:9px; }
  thead th[aria-sort] button{ color:var(--ink); }
  thead th[aria-sort] .arrow{ opacity:1; color:var(--accent); }
  th.c-check, td.c-check{ width:36px; padding-left:12px; }
  th.c-act, td.c-act{ width:38px; }

  tbody td{
    border-bottom:1px solid var(--line-soft);
    padding:8px 10px; vertical-align:middle;
    font-size:13px; color:var(--ink-2);
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover td{ background:var(--surface-2); }
  tbody tr[data-on="1"] td{ background:var(--accent-wash); }
  tbody tr[data-on="1"] td.c-check{ box-shadow:inset 2px 0 0 var(--accent); }

  td.c-name{ color:var(--ink); font-weight:600; }
  td.c-title{ color:var(--muted); font-size:12.5px; }
  td.c-mono{ font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.c-email{ font-family:var(--mono); font-size:12px; word-break:break-all; }
  td.c-mkt{ font-family:var(--mono); font-size:12px; font-weight:500; letter-spacing:.04em; }
  .firm{
    background:none; border:none; padding:0; cursor:pointer; text-align:left;
    font:inherit; color:var(--ink-2); border-bottom:1px dotted transparent;
  }
  .firm:hover{ color:var(--accent); border-bottom-color:var(--accent-line); }
  .dash{ color:var(--muted); }

  .tag{
    display:inline-block; font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.06em;
    padding:2px 6px; border-radius:3px; color:#fff; white-space:nowrap;
  }
  .tag.slb{ background:var(--tag-slb); }
  .tag.oh{ background:var(--tag-oh); }
  .tag.az{ background:var(--tag-az); }

  input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--accent); cursor:pointer; margin:0; display:block; }

  .rowcopy{
    width:26px; height:26px; border-radius:5px; border:1px solid transparent; background:none;
    color:var(--muted); font-size:13px; cursor:pointer; opacity:0; line-height:1;
  }
  tr:hover .rowcopy, .rowcopy:focus-visible{ opacity:1; }
  .rowcopy:hover{ border-color:var(--accent-line); color:var(--accent); }
  .rowcopy[data-ok="1"]{ opacity:1; color:var(--accent); }

  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .tfoot{ padding:12px; text-align:center; }
  .empty{ padding:46px 20px; text-align:center; color:var(--muted); font-size:13.5px; }

  /* ---------- action bar ---------- */
  .actions{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--surface); border-top:1px solid var(--line);
    padding:10px clamp(12px,2.2vw,22px);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    box-shadow:0 -1px 12px rgba(0,0,0,.06);
  }
  .actions .status{ flex:1 1 200px; font-size:13px; color:var(--muted); min-width:0; }
  .actions .status b{ color:var(--ink); font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; }
  .flash{ font-size:12.5px; color:var(--accent); font-weight:600; }

  @media (max-width:820px){
    .brand .nm, .search kbd{ display:none; }
    td.c-title{ display:none; }
    th.c-title{ display:none; }
  }
  @media (max-width:640px){
    body{ padding-bottom:104px; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tbody tr{
      position:relative; border-bottom:1px solid var(--line-soft);
      padding:10px 44px 10px 38px;
      display:grid; grid-template-columns:1fr auto; gap:2px 8px;
    }
    tbody tr:hover td{ background:none; }
    tbody tr[data-on="1"]{ background:var(--accent-wash); box-shadow:inset 2px 0 0 var(--accent); }
    tbody td{ border:none; padding:0; background:none !important; box-shadow:none !important; }
    td.c-check{ position:absolute; left:12px; top:12px; width:auto; padding:0; }
    td.c-name{ grid-area:1 / 1; font-size:14px; }
    td.c-mkt{ grid-area:1 / 2; text-align:right; color:var(--muted); }
    td.c-company{ grid-area:2 / 1 / 3 / 3; font-size:12.5px; }
    td.c-mono{ grid-area:3 / 1; font-size:12px; }
    td.c-list{ grid-area:3 / 2; text-align:right; }
    td.c-email{ grid-area:4 / 1 / 5 / 3; font-size:12px; }
    td.c-act{ position:absolute; right:8px; top:50%; transform:translateY(-50%); width:auto; }
    .rowcopy{ opacity:1; }
    .grid-form{ grid-template-columns:1fr 1fr; }
    .actions .status{ flex:1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>

<header class="bar" id="commandBar">
  <div class="bar-row">
    <div class="brand">
      <img src="assets/logo.png" alt="DWG Capital Group">
      <span class="rule"></span>
      <span class="nm">Broker Network</span>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="search" placeholder="Search name, firm, market, email, phone" autocomplete="off" aria-label="Search brokers">
      <kbd>/</kbd>
    </div>

    <div class="segs" id="listSegs" role="group" aria-label="Contact list">
      <button type="button" id="segAll" data-cat="all" aria-pressed="true">All</button>
      <button type="button" id="segSlb" data-cat="main" aria-pressed="false">SLB</button>
      <button type="button" id="segOh" data-cat="ohio" aria-pressed="false">Ohio</button>
      <button type="button" id="segAz" data-cat="az" aria-pressed="false">Arizona</button>
    </div>

    <select class="sel" id="marketSelect" aria-label="Market">
      <option value="">All markets</option>
    </select>

    <div class="bar-spacer"></div>

    <button class="btn" type="button" id="askToggle" aria-pressed="false" style="display:none;">Ask AI</button>
    <button class="btn" type="button" id="addToggle" aria-pressed="false" style="display:none;">Add broker</button>
    <button class="btn" type="button" id="themeToggle" aria-label="Switch theme">Theme</button>
  </div>

  <div class="scope" id="scopeLine">
    <span><span class="fig" id="scopeCount">0</span> <span id="scopeNoun">contacts</span></span>
    <span id="scopeWhere"></span>
    <button class="clear" type="button" id="resetBtn" style="display:none;">Reset filters</button>
  </div>
</header>

<section class="panel" id="askPanel" style="display:none;">
  <h2>Ask AI</h2>
  <p class="hint" id="askScope">Answers from the contacts currently in view.</p>
  <div class="panel-row">
    <input id="askInput" type="text" placeholder="Who are my CBRE contacts in Arizona?" autocomplete="off">
    <button class="go" type="button" id="askSend">Ask</button>
    <button class="btn" type="button" id="askStop" style="display:none;">Stop</button>
  </div>
  <div class="answer" id="askAnswer" style="display:none;"></div>
</section>

<section class="panel" id="addPanel" style="display:none;">
  <h2>Add broker</h2>
  <p class="hint">Saved to this page for everyone who opens it. No trip back to chat.</p>
  <div class="grid-form">
    <input id="afName" type="text" placeholder="Name">
    <input id="afCompany" type="text" placeholder="Firm">
    <input id="afTitle" type="text" placeholder="Title">
    <input id="afPhone" type="text" placeholder="Phone">
    <input id="afEmail" type="text" placeholder="Email">
    <input id="afState" type="text" placeholder="Market (CA)" maxlength="2">
    <select id="afPool">
      <option value="main">SLB Brokers</option>
      <option value="ohio">Ohio tenant rep</option>
      <option value="az">Arizona tenant rep</option>
    </select>
    <button class="go" type="button" id="afSave">Save broker</button>
  </div>
  <div class="note" id="afNote"></div>
</section>

<section class="panel" id="previewPanel" style="display:none;">
  <h2>Copy preview</h2>
  <p class="hint" id="previewHint">Exactly what lands on your clipboard.</p>
  <textarea id="previewText" readonly spellcheck="false" onclick="this.select()"></textarea>
</section>

<main class="sheet">
  <div class="tablewrap">
    <table id="grid">
      <thead>
        <tr>
          <th class="c-check" scope="col"><input type="checkbox" id="selectAll" aria-label="Select all matching contacts"></th>
          <th class="c-name" scope="col" data-key="n"><button type="button">Name <span class="arrow">&#9650;</span></button></th>
          <th class="c-company" scope="col" data-key="c" aria-sort="ascending"><button type="button">Firm <span class="arrow">&#9650;</span></button></th>
          <th class="c-title" scope="col" data-key="t"><button type="button">Title <span class="arrow">&#9650;</span></button></th>
          <th class="c-mkt" scope="col" data-key="s"><button type="button">Mkt <span class="arrow">&#9650;</span></button></th>
          <th class="c-mono" scope="col" data-key="p"><button type="button">Phone <span class="arrow">&#9650;</span></button></th>
          <th class="c-email" scope="col" data-key="e"><button type="button">Email <span class="arrow">&#9650;</span></button></th>
          <th class="c-list" scope="col" data-key="cat"><button type="button">List <span class="arrow">&#9650;</span></button></th>
          <th class="c-act" scope="col"><span class="sr">Copy</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">No contacts match that search.</div>
    <div class="tfoot" id="moreWrap" style="display:none;">
      <button class="btn" type="button" id="moreBtn">Show more</button>
    </div>
  </div>
</main>

<div class="actions">
  <div class="status" id="statusLine">Loading contacts</div>
  <button class="btn" type="button" id="previewToggle" aria-pressed="false">Preview</button>
  <select class="sel" id="formatSelect" aria-label="Copy format">
    <option value="table">Name · Firm · Phone · Email</option>
    <option value="email_semicolon">Emails — semicolons</option>
    <option value="email_comma">Emails — commas</option>
    <option value="csv">CSV</option>
  </select>
  <button class="go" type="button" id="copyBtn">Copy</button>
  <span class="flash" id="flash" role="status" aria-live="polite"></span>
</div>

<script src="brokers.js"></script>
<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };

  // ---- source data ---------------------------------------------------------
  var RAW = Array.isArray(window.DWG_BROKERS) ? window.DWG_BROKERS : [];
  var LOAD_FAILED = !RAW.length;

  // Source lists arrive in mixed case, plenty of it SHOUTED. Fix once at load
  // rather than on every render — 6,000 rows re-cased per keystroke is not free.
  var KEEP = {LLC:1,INC:1,CBRE:1,SIOR:1,JLL:1,NAI:1,LLP:1,USA:1,III:1,II:1,IV:1,LP:1,PC:1,KW:1,RE:1,EVP:1,SVP:1,VP:1,CEO:1,CFO:1,COO:1,SF:1,IOS:1,SLB:1};
  function smartCase(s){
    if(!s) return "";
    return s.replace(/[A-Za-z']+/g, function(w){
      if(w !== w.toUpperCase()) return w;
      var bare = w.replace(/'/g,"");
      if(bare.length <= 2 || KEEP[bare]) return w;
      return w.charAt(0) + w.slice(1).toLowerCase();
    });
  }

  function prep(r, id){
    var n = smartCase(r.n || ""), c = smartCase(r.c || ""), t = smartCase(r.t || "");
    var raw = (r.c || "").trim();
    return {
      id: id,
      n: n, c: c, t: t,
      e: r.e || "", p: r.p || "",
      s: (r.s || "").toUpperCase(),
      cat: r.cat || "main",
      firm: (!raw || /^\(.*\)$/.test(raw)) ? "" : c,
      hay: (n+" "+c+" "+(r.e||"")+" "+(r.p||"")+" "+t+" "+(r.s||"")+" "+(r.city||"")).toLowerCase()
    };
  }

  var BASE = RAW.map(function(r,i){ return prep(r, "b"+i); });
  var addedRows = [];
  var ALL = BASE;

  var MARKETS = {AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"Washington D.C."};
  var LIST_LABEL = { main:"SLB brokers", ohio:"Ohio tenant rep", az:"Arizona tenant rep" };
  var TAG = { main:["slb","SLB"], ohio:["oh","OH"], az:["az","AZ"] };

  // ---- state ---------------------------------------------------------------
  var state = { q:"", terms:[], cat:"all", mkt:"", firm:"", key:"c", dir:1 };
  var picked = Object.create(null);
  var pickedCount = 0;
  var view = [];
  var shown = 0;
  var PAGE = 150;

  // ---- theme ---------------------------------------------------------------
  try{
    var saved = localStorage.getItem("dwg_broker_theme");
    if(saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
  $("themeToggle").addEventListener("click", function(){
    var now = document.documentElement.getAttribute("data-theme");
    if(!now){
      now = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    var next = now === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("dwg_broker_theme", next); }catch(e){}
  });

  // sticky table header has to clear the command bar, whose height changes with wrapping
  function measureBar(){
    document.documentElement.style.setProperty("--bar-h", $("commandBar").offsetHeight + "px");
  }
  measureBar();
  window.addEventListener("resize", measureBar);

  // ---- filtering + sorting -------------------------------------------------
  function matches(r){
    if(state.cat !== "all" && r.cat !== state.cat) return false;
    if(state.mkt && (r.s || "—") !== state.mkt) return false;
    if(state.firm && r.firm.toLowerCase() !== state.firm) return false;
    for(var i=0;i<state.terms.length;i++){
      if(r.hay.indexOf(state.terms[i]) === -1) return false;
    }
    return true;
  }

  function compare(a, b){
    var k = state.key;
    var av = (a[k] || ""), bv = (b[k] || "");
    if(k === "cat"){ av = LIST_LABEL[av] || av; bv = LIST_LABEL[bv] || bv; }
    // rows missing the sort field sink to the bottom in both directions
    if(!av && bv) return 1;
    if(av && !bv) return -1;
    av = av.toLowerCase(); bv = bv.toLowerCase();
    if(av < bv) return -state.dir;
    if(av > bv) return state.dir;
    if(k !== "n"){
      var an = a.n.toLowerCase(), bn = b.n.toLowerCase();
      if(an < bn) return -1;
      if(an > bn) return 1;
    }
    return 0;
  }

  function rebuild(){
    view = ALL.filter(matches);
    view.sort(compare);
    shown = 0;
    renderMarkets();
    renderRows(true);
    renderScope();
    renderStatus();
  }

  // ---- rendering -----------------------------------------------------------
  function esc(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function renderMarkets(){
    var counts = {}, pool = ALL.filter(function(r){ return state.cat === "all" || r.cat === state.cat; });
    pool.forEach(function(r){ var k = r.s || "—"; counts[k] = (counts[k]||0)+1; });
    var keys = Object.keys(counts).filter(function(k){ return k !== "—"; }).sort(function(a,b){ return counts[b]-counts[a]; });
    var html = '<option value="">All markets</option>';
    keys.forEach(function(k){
      html += '<option value="'+k+'"'+(state.mkt===k?" selected":"")+'>'+k+' — '+esc(MARKETS[k]||k)+' ('+counts[k]+')</option>';
    });
    if(counts["—"]) html += '<option value="—"'+(state.mkt==="—"?" selected":"")+'>Market not listed ('+counts["—"]+')</option>';
    $("marketSelect").innerHTML = html;
  }

  function rowHtml(r){
    var tag = TAG[r.cat] || TAG.main;
    var firmCell = r.firm
      ? '<button class="firm" type="button" data-firm="'+esc(r.firm.toLowerCase())+'" title="Show everyone at '+esc(r.firm)+'">'+esc(r.firm)+'</button>'
      : '<span class="dash">Independent</span>';
    return '<tr data-id="'+r.id+'"'+(picked[r.id]?' data-on="1"':'')+'>'+
      '<td class="c-check"><input type="checkbox" aria-label="Select '+esc(r.n)+'"'+(picked[r.id]?" checked":"")+'></td>'+
      '<td class="c-name">'+esc(r.n)+'</td>'+
      '<td class="c-company">'+firmCell+'</td>'+
      '<td class="c-title">'+(r.t ? esc(r.t) : '<span class="dash">—</span>')+'</td>'+
      '<td class="c-mkt">'+(r.s ? esc(r.s) : '<span class="dash">—</span>')+'</td>'+
      '<td class="c-mono">'+(r.p ? esc(r.p) : '<span class="dash">—</span>')+'</td>'+
      '<td class="c-email">'+(r.e ? esc(r.e) : '<span class="dash">—</span>')+'</td>'+
      '<td class="c-list"><span class="tag '+tag[0]+'">'+tag[1]+'</span></td>'+
      '<td class="c-act"><button class="rowcopy" type="button" title="Copy this contact">&#10697;</button></td>'+
    '</tr>';
  }

  function renderRows(reset){
    var body = $("rows");
    if(reset){ body.innerHTML = ""; shown = 0; }
    var next = view.slice(shown, shown + PAGE);
    var html = "";
    for(var i=0;i<next.length;i++) html += rowHtml(next[i]);
    body.insertAdjacentHTML("beforeend", html);
    shown += next.length;

    $("emptyState").textContent = LOAD_FAILED
      ? "Contact data did not load. Reload the page."
      : "No contacts match that search.";
    $("emptyState").style.display = view.length === 0 ? "block" : "none";
    $("moreWrap").style.display = shown < view.length ? "block" : "none";
    $("moreBtn").textContent = "Show " + Math.min(PAGE, view.length - shown).toLocaleString() + " more of " + (view.length - shown).toLocaleString();
    syncSelectAll();
  }

  function renderScope(){
    $("scopeCount").textContent = view.length.toLocaleString();
    $("scopeNoun").textContent = view.length === 1 ? "contact" : "contacts";
    var bits = [];
    if(state.cat !== "all") bits.push(LIST_LABEL[state.cat]);
    if(state.firm) bits.push("at " + (view.length ? view[0].firm : state.firm));
    if(state.mkt) bits.push("in " + (state.mkt === "—" ? "unlisted markets" : (MARKETS[state.mkt] || state.mkt)));
    if(state.q) bits.push('matching “' + state.q + '”');
    $("scopeWhere").textContent = bits.length ? bits.join(" · ") : "across every list";
    var filtered = !!(state.cat !== "all" || state.mkt || state.firm || state.q);
    $("resetBtn").style.display = filtered ? "inline" : "none";
  }

  // What Copy actually puts on the clipboard. Selections made under an earlier
  // filter can fall entirely out of view; copying nothing would be a silent
  // failure, so an empty selection-in-view falls back to the whole view.
  function selectedInView(){
    if(!pickedCount) return [];
    return view.filter(function(r){ return picked[r.id]; });
  }
  function targetRows(){
    var sel = selectedInView();
    return sel.length ? sel : view;
  }

  function renderStatus(){
    var sel = selectedInView();
    var fmt = $("formatSelect").value;
    var noun = (fmt === "email_semicolon" || fmt === "email_comma") ? " — emails only" : "";
    var msg, aside = "";
    if(sel.length){
      msg = "<b>" + sel.length.toLocaleString() + "</b> selected";
      aside = sel.length < pickedCount
        ? (pickedCount - sel.length).toLocaleString() + " more selected outside this filter"
        : "clear the checkboxes to copy everything in view";
    }else{
      msg = "<b>" + view.length.toLocaleString() + "</b> in view";
      if(pickedCount) aside = pickedCount.toLocaleString() + " selected, none in this filter";
    }
    $("statusLine").innerHTML = msg + " ready to copy" + noun +
      (aside ? ' · <span style="color:var(--muted)">' + aside + "</span>" : "");
    if($("previewPanel").style.display !== "none") renderPreview();
  }

  // ---- copy ----------------------------------------------------------------
  function formatList(rows, fmt){
    if(fmt === "email_semicolon") return rows.map(function(r){ return r.e; }).filter(Boolean).join("; ");
    if(fmt === "email_comma") return rows.map(function(r){ return r.e; }).filter(Boolean).join(", ");
    if(fmt === "csv"){
      var out = ["Name,Firm,Title,Market,Phone,Email,List"];
      rows.forEach(function(r){
        out.push([r.n, r.firm, r.t, r.s, r.p, r.e, LIST_LABEL[r.cat] || r.cat].map(function(v){
          return '"' + String(v || "").replace(/"/g, '""') + '"';
        }).join(","));
      });
      return out.join("\n");
    }
    return rows.map(function(r){
      var bits = [r.n];
      if(r.t) bits.push(r.t);
      if(r.firm) bits.push(r.firm);
      if(r.p) bits.push(r.p);
      if(r.e) bits.push(r.e);
      return bits.join("  |  ");
    }).join("\n");
  }

  function toClipboard(text, done){
    if(!text){ done(false); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(text, done); });
    }else{
      fallback(text, done);
    }
  }
  function fallback(text, done){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    }catch(err){ done(false); }
  }

  function flash(msg){
    var el = $("flash");
    el.textContent = msg;
    setTimeout(function(){ if(el.textContent === msg) el.textContent = ""; }, 2400);
  }

  $("copyBtn").addEventListener("click", function(){
    var rows = targetRows();
    var text = formatList(rows, $("formatSelect").value);
    toClipboard(text, function(ok){
      flash(ok ? "Copied " + rows.length.toLocaleString() + " contacts" : "Copy blocked — open Preview and copy from there");
      if(!ok) openPreview(true);
    });
  });

  function renderPreview(){
    var rows = targetRows();
    $("previewText").value = formatList(rows, $("formatSelect").value);
    $("previewHint").textContent = "Exactly what lands on your clipboard — " + rows.length.toLocaleString() + " contacts.";
  }
  function openPreview(force){
    var panel = $("previewPanel");
    var open = force ? true : panel.style.display === "none";
    panel.style.display = open ? "block" : "none";
    $("previewToggle").setAttribute("aria-pressed", String(open));
    if(open) renderPreview();
    measureBar();
  }
  $("previewToggle").addEventListener("click", function(){ openPreview(false); });
  $("formatSelect").addEventListener("change", renderStatus);

  // ---- selection -----------------------------------------------------------
  function setPicked(id, on){
    if(on){ if(!picked[id]){ picked[id] = true; pickedCount++; } }
    else if(picked[id]){ delete picked[id]; pickedCount--; }
  }

  function syncSelectAll(){
    var box = $("selectAll");
    var sel = selectedInView().length;
    box.checked = view.length > 0 && sel === view.length;
    box.indeterminate = sel > 0 && sel < view.length;
  }

  $("selectAll").addEventListener("change", function(){
    var on = $("selectAll").checked;
    view.forEach(function(r){ setPicked(r.id, on); });
    Array.prototype.forEach.call($("rows").querySelectorAll("tr"), function(tr){
      var id = tr.getAttribute("data-id");
      tr.querySelector('input[type="checkbox"]').checked = !!picked[id];
      if(picked[id]) tr.setAttribute("data-on","1"); else tr.removeAttribute("data-on");
    });
    renderStatus();
    syncSelectAll();
  });

  $("rows").addEventListener("change", function(e){
    var box = e.target;
    if(box.type !== "checkbox") return;
    var tr = box.closest("tr");
    setPicked(tr.getAttribute("data-id"), box.checked);
    if(box.checked) tr.setAttribute("data-on","1"); else tr.removeAttribute("data-on");
    renderStatus();
    syncSelectAll();
  });

  $("rows").addEventListener("click", function(e){
    var firmBtn = e.target.closest(".firm");
    if(firmBtn){
      state.firm = firmBtn.getAttribute("data-firm");
      rebuild();
      window.scrollTo({ top:0, behavior:"smooth" });
      return;
    }
    var copyBtn = e.target.closest(".rowcopy");
    if(copyBtn){
      var id = copyBtn.closest("tr").getAttribute("data-id");
      var rec = null;
      for(var i=0;i<ALL.length;i++){ if(ALL[i].id === id){ rec = ALL[i]; break; } }
      if(!rec) return;
      toClipboard(formatList([rec], $("formatSelect").value), function(ok){
        copyBtn.innerHTML = ok ? "&#10003;" : "&#10007;";
        copyBtn.setAttribute("data-ok","1");
        setTimeout(function(){ copyBtn.innerHTML = "&#10697;"; copyBtn.removeAttribute("data-ok"); }, 1400);
      });
    }
  });

  // ---- controls ------------------------------------------------------------
  var searchTimer;
  $("searchInput").addEventListener("input", function(){
    clearTimeout(searchTimer);
    var v = $("searchInput").value;
    searchTimer = setTimeout(function(){
      state.q = v.trim();
      state.terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      rebuild();
    }, 110);
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "/" && document.activeElement !== $("searchInput") && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
      e.preventDefault();
      $("searchInput").focus();
    }
  });

  Array.prototype.forEach.call($("listSegs").querySelectorAll("button"), function(btn){
    btn.addEventListener("click", function(){
      Array.prototype.forEach.call($("listSegs").querySelectorAll("button"), function(b){ b.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
      state.cat = btn.getAttribute("data-cat");
      state.mkt = ""; state.firm = "";
      rebuild();
    });
  });

  $("marketSelect").addEventListener("change", function(){
    state.mkt = $("marketSelect").value;
    rebuild();
  });

  $("resetBtn").addEventListener("click", function(){
    state.q = ""; state.terms = []; state.cat = "all"; state.mkt = ""; state.firm = "";
    $("searchInput").value = "";
    Array.prototype.forEach.call($("listSegs").querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-cat") === "all" ? "true" : "false");
    });
    rebuild();
  });

  $("moreBtn").addEventListener("click", function(){ renderRows(false); });

  Array.prototype.forEach.call(document.querySelectorAll("thead th[data-key]"), function(th){
    th.querySelector("button").addEventListener("click", function(){
      var key = th.getAttribute("data-key");
      if(state.key === key){ state.dir = -state.dir; }
      else { state.key = key; state.dir = 1; }
      Array.prototype.forEach.call(document.querySelectorAll("thead th[data-key]"), function(o){ o.removeAttribute("aria-sort"); });
      th.setAttribute("aria-sort", state.dir === 1 ? "ascending" : "descending");
      th.querySelector(".arrow").innerHTML = state.dir === 1 ? "&#9650;" : "&#9660;";
      rebuild();
    });
  });

  // ---- live additions (db capability) --------------------------------------
  var dbCol = null;

  function afNote(msg, bad){
    var el = $("afNote");
    el.textContent = msg || "";
    el.className = bad ? "note err" : "note";
  }

  $("addToggle").addEventListener("click", function(){
    var open = $("addPanel").style.display === "none";
    $("addPanel").style.display = open ? "block" : "none";
    $("addToggle").setAttribute("aria-pressed", String(open));
    if(open) $("afName").focus();
    measureBar();
  });

  $("afSave").addEventListener("click", function(){
    var name = $("afName").value.trim();
    var email = $("afEmail").value.trim();
    var phone = $("afPhone").value.trim();
    if(!name){ afNote("Add a name.", true); return; }
    if(!email && !phone){ afNote("Add a phone or an email so the contact is reachable.", true); return; }
    if(!dbCol){ afNote("Saving needs the page open on claude.ai.", true); return; }
    afNote("Saving…");
    dbCol.add({
      n:name, c:$("afCompany").value.trim(), t:$("afTitle").value.trim(),
      p:phone, e:email, s:$("afState").value.trim().toUpperCase(),
      city:"", src:"Added on the page", cat:$("afPool").value
    }).then(function(){
      afNote("Saved. Everyone who opens this page sees it.");
      ["afName","afCompany","afTitle","afPhone","afEmail","afState"].forEach(function(id){ $(id).value = ""; });
    }, function(err){
      afNote("Save failed: " + ((err && err.message) || "unknown error"), true);
    });
  });

  function initDb(){
    if(!(window.claude && window.claude.use)) return;
    window.claude.use("db").then(function(db){
      if(!db) return;
      dbCol = db.collection("added_brokers");
      $("addToggle").style.display = "inline-block";
      measureBar();
      dbCol.onSnapshot(function(snap){
        addedRows = snap.docs.map(function(d){ return prep(d.data() || {}, "a"+d.id); });
        ALL = BASE.concat(addedRows);
        rebuild();
      }, function(err){ console.error("db subscribe", err); });
    }, function(){});
  }

  // ---- Ask AI (sample capability) ------------------------------------------
  var sampleFn = null, askAbort = null;

  $("askToggle").addEventListener("click", function(){
    var open = $("askPanel").style.display === "none";
    $("askPanel").style.display = open ? "block" : "none";
    $("askToggle").setAttribute("aria-pressed", String(open));
    if(open) $("askInput").focus();
    measureBar();
  });

  function askContext(){
    var rows = targetRows();
    var BUDGET = 45000, used = 0, lines = [], cut = false;
    for(var i=0;i<rows.length;i++){
      var r = rows[i];
      var line = r.n+" | "+(r.firm||"—")+" | "+r.t+" | "+r.p+" | "+r.e+" | "+r.s+" | "+(LIST_LABEL[r.cat]||r.cat);
      used += line.length + 1;
      if(used > BUDGET){ cut = true; break; }
      lines.push(line);
    }
    return { text:lines.join("\n"), included:lines.length, total:rows.length, cut:cut };
  }

  function runAsk(){
    var q = $("askInput").value.trim();
    if(!q || !sampleFn) return;
    var out = $("askAnswer");
    out.style.display = "block";
    out.className = "answer";
    out.textContent = "Working…";
    $("askSend").disabled = true;
    $("askStop").style.display = "inline-block";

    var ctx = askContext();
    var prompt =
      "You are answering a question about a broker contact list for DWG Capital Partners, an industrial real estate investment firm. " +
      "Use ONLY the data below. Never invent a name, firm, phone or email. If the data does not answer the question, say so plainly. " +
      "Be concise — short prose or a short list, no headers.\n\n" +
      "DATA (Name | Firm | Title | Phone | Email | Market | List) — " + ctx.included + " of " + ctx.total + " contacts in view" +
      (ctx.cut ? " (truncated to fit, so totals may be incomplete)" : "") + ":\n" +
      ctx.text + "\n\nQUESTION: " + q;

    askAbort = new AbortController();
    sampleFn(prompt, {
      modelTier:"quick",
      signal:askAbort.signal,
      onText:function(u){ out.textContent = u.text; }
    }).then(function(){
      $("askSend").disabled = false;
      $("askStop").style.display = "none";
    }, function(err){
      $("askSend").disabled = false;
      $("askStop").style.display = "none";
      if(err && err.code === "cancelled") return;
      out.className = "answer err";
      out.textContent = (err && err.text) || ({
        not_granted:"Ask AI needs your permission — try again and allow it.",
        rate_limited:"Too many requests. Try again in a moment.",
        session_expired:"Session expired. Refresh the page.",
        prompt_too_large:"Too many contacts for one question — narrow the filters first."
      }[err && err.code] || "That did not go through. Try again.");
    });
  }

  $("askSend").addEventListener("click", runAsk);
  $("askInput").addEventListener("keydown", function(e){ if(e.key === "Enter") runAsk(); });
  $("askStop").addEventListener("click", function(){ if(askAbort) askAbort.abort(); });

  function initSample(){
    if(!(window.claude && window.claude.use)) return;
    window.claude.use("sample").then(function(fn){
      if(!fn) return;
      sampleFn = fn;
      $("askToggle").style.display = "inline-block";
      measureBar();
    }, function(){});
  }

  // ---- go ------------------------------------------------------------------
  rebuild();
  initDb();
  initSample();
})();
</script>
